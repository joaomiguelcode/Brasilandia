<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>loadscreen</title>
    <link rel="stylesheet" type="text/css" href="theforce.css">
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"
        integrity="sha256-CSXorXvZcTkaix6Yvo6HppcZGetbYMGWSFlBw8HfCJo=" crossorigin="anonymous"></script>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
</head>

<body>

    <div id="fare"></div>
    <div class="carregando">
        <h2 class="animate"><b></b></h2>
    </div>
    <video autoplay loop id="myVideo" muted="muted">
        <source src="http://131.196.198.90/loading/brasilandia.mp4" type="video/mp4">
    </video>

    <div class="content-center">PRESSIONE <b>ESPAÇO</b> PARA PAUSAR OU REPRODUZIR</div>

    <audio id="music" preload="auto">
        <source src="http://131.196.198.90/musicas/reliquia_2t.mp3" type="audio/mp3">
    </audio>

    <script>
        var music = document.getElementById("music");
        music.volume = 0.5;
        music.play();

        music.addEventListener("ended", function () {
            music.currentTime = 0;
            music.play();
        });

        document.addEventListener('keydown', function (e) {
            if (e.code === 'Space') {
                if (music.paused) {
                    music.play();
                } else {
                    music.pause();
                }
            }
        });
    </script>

</body>
</html>
